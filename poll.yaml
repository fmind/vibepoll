# Docs: https://yaml.org/spec/1.2.2/
# Poll definition for vibepoll.
#
# This is the deck vibepoll was built for: Agentic AI Night #1, the AAIF
# Luxembourg launch. It ships as the default so the app runs out of the box and
# so there is a worked example to copy. Replace it with your own questions, or
# keep yours elsewhere and point VIBEPOLL_CONFIG at it.
#
# Prose is quoted throughout on purpose. Unquoted YAML scalars eat a trailing
# `#1` as a comment and choke on a `: ` inside a label, and `yes`/`no`/`on`/`off`
# parse as booleans — so an option id spelled like one has to be quoted too.
# Quoting everything makes this file safe to edit without knowing any of that.

# Revised answer meanings get a fresh key; earlier responses remain intact.
id: aaif-luxembourg-1-v2
title: "Agentic AI Night #1"
subtitle: "AAIF Luxembourg Launch"
repo: https://github.com/fmind/vibepoll
panel_seconds: 8

questions:
  - id: familiarity
    title: "Which best describes your experience with AI agents?"
    subtitle: "Agents use tools to carry out tasks. Choose the closest match; if you build agents, choose that."
    options:
      - id: unused
        label: "Never used agents"
      - id: tried
        label: "Tried agents occasionally"
      - id: user
        label: "Use agents regularly without building them"
      - id: builder
        label: "Build agents"

  - id: role
    title: "What is your primary role?"
    subtitle: "Choose the closest match to your work or studies."
    options:
      - id: engineering
        label: "Software, AI, or data engineering"
      - id: platform
        label: "Platform, infrastructure, or IT"
      - id: security
        label: "Security, risk, or compliance"
      - id: business
        label: "Product or business operations"
      - id: leadership
        label: "Leadership or management"
      - id: education
        label: "Research, education, or student"
      - id: other
        label: "Other role"
      - id: private
        label: "Prefer not to say"

  - id: usecase
    title: "What have you mainly used AI agents for in the past 30 days?"
    subtitle: "Choose one activity."
    options:
      - id: coding
        label: "Software development and testing"
      - id: research
        label: "Research and information analysis"
      - id: workspace
        label: "Email, documents, and personal productivity"
      - id: business
        label: "Finance, legal, or procurement"
      - id: support
        label: "Customer support and service"
      - id: other
        label: "Another activity"
      - id: unused
        label: "No agent use in the past 30 days"

  - id: reliability
    title: "How often do you need to substantially correct an agent's work?"
    subtitle: "Think about the past 30 days. Substantial correction means more than minor edits."
    options:
      - id: always
        label: "Almost always"
      - id: often
        label: "Often"
      - id: sometimes
        label: "Sometimes"
      - id: rarely
        label: "Rarely"
      - id: never
        label: "Never"
      - id: unsure
        label: "Not enough recent experience"

  - id: blocker
    title: "What is your main barrier to wider use of AI agents?"
    subtitle: "Choose the one that most limits you today."
    options:
      - id: reliability
        label: "Unreliable results"
      - id: security
        label: "Security or privacy concerns"
      - id: integration
        label: "Integration difficulties"
      - id: value
        label: "Unclear value"
      - id: skills
        label: "Lack of time or skills"
      - id: other
        label: "Other"
      - id: none
        label: "No major barrier"
      - id: unsure
        label: "Not sure"

  - id: topic
    title: "What should we cover next?"
    subtitle: "Choose the session you would most like to attend."
    options:
      - id: building
        label: "Building agents"
      - id: evaluation
        label: "Testing and evaluation"
      - id: security
        label: "Security"
      - id: memory
        label: "Memory and retrieval"
      - id: operations
        label: "Deployment and operations"
      - id: unsure
        label: "Not sure"

  # Current foundation projects: https://aaif.io/
  - id: aaif-project
    title: "Which AAIF project would you most like us to cover?"
    subtitle: "Pick your favorite for a future session."
    options:
      - id: mcp
        label: "Model Context Protocol (MCP)"
      - id: agents-md
        label: "AGENTS.md"
      - id: goose
        label: "goose"
      - id: agentgateway
        label: "agentgateway"
      - id: a2a
        label: "Agent2Agent (A2A)"
      - id: agent-router
        label: "Agent Router"
      - id: unsure
        label: "Not sure"

  - id: message
    type: text
    title: "What message would you like to share with the audience or organizers tonight?"
    subtitle: "Your message will appear on the big screen. Up to 500 characters; leave out personal details."
